<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Brown pelican over Pigeon Point Tobago">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="60%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#083344"/>
    </linearGradient>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="60%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
    <linearGradient id="pelican-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <radialGradient id="sun2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#sky2)"/>
  <!-- Sun -->
  <circle cx="400" cy="380" r="180" fill="url(#sun2)"/>
  <circle cx="400" cy="380" r="80" fill="#fef3c7"/>

  <!-- Ocean -->
  <rect y="500" width="800" height="300" fill="url(#sea)"/>

  <!-- Wave highlights -->
  <path d="M0 540 Q 100 528 200 540 T 400 540 T 600 540 T 800 540" stroke="#cffafe" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M0 590 Q 120 580 240 590 T 480 590 T 720 590" stroke="#a5f3fc" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M0 650 Q 150 640 300 650 T 600 650" stroke="#67e8f9" stroke-width="2" fill="none" opacity="0.3"/>

  <!-- Pigeon Point jetty silhouette (distant) -->
  <g fill="#451a03" opacity="0.85">
    <rect x="80" y="470" width="200" height="8"/>
    <rect x="95" y="478" width="6" height="22"/>
    <rect x="145" y="478" width="6" height="22"/>
    <rect x="195" y="478" width="6" height="22"/>
    <rect x="245" y="478" width="6" height="22"/>
    <!-- Thatched hut roof -->
    <path d="M270 470 L 320 430 L 370 470 Z"/>
    <rect x="285" y="470" width="70" height="30"/>
  </g>

  <!-- Pelican in flight -->
  <g transform="translate(490 220) scale(1.1)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="58" ry="34" fill="url(#pelican-body)"/>
    <!-- Neck -->
    <path d="M-45 -8 Q -70 -25 -78 -50 Q -82 -62 -74 -66 Q -62 -68 -55 -58 Q -48 -48 -52 -32 Q -54 -20 -45 -8" fill="url(#pelican-body)"/>
    <!-- Head -->
    <ellipse cx="-76" cy="-64" rx="15" ry="12" fill="#78350f"/>
    <!-- Eye -->
    <circle cx="-80" cy="-66" r="2.2" fill="#fff"/>
    <!-- Beak (long) -->
    <path d="M-90 -62 Q -130 -58 -155 -45 Q -118 -50 -88 -54 Z" fill="#f97316"/>
    <!-- Pouch under beak -->
    <path d="M-90 -54 Q -120 -50 -148 -42 Q -118 -46 -88 -48 Z" fill="#ea580c" opacity="0.7"/>
    <!-- Wings -->
    <path d="M-10 -20 Q 30 -80 100 -110 Q 70 -60 40 -25 Q 15 -10 -10 -20 Z" fill="#451a03"/>
    <path d="M0 -8 Q 60 -30 130 -15 Q 70 -5 20 0 Z" fill="#78350f"/>
    <!-- Tail -->
    <path d="M50 -8 L 90 -18 L 60 4 Z" fill="#451a03"/>
    <!-- Legs tucked -->
    <path d="M38 22 L 55 30 M 42 25 L 60 33" stroke="#451a03" stroke-width="3" fill="none"/>
  </g>

  <!-- Second distant pelican -->
  <g transform="translate(230 160) scale(0.55)" opacity="0.7">
    <ellipse cx="0" cy="0" rx="58" ry="34" fill="#451a03"/>
    <path d="M-45 -8 Q -70 -25 -78 -50 Q -82 -62 -74 -66 Q -62 -68 -55 -58 Q -48 -48 -52 -32 Q -54 -20 -45 -8" fill="#451a03"/>
    <path d="M-90 -62 Q -130 -58 -155 -45 Q -118 -50 -88 -54 Z" fill="#451a03"/>
    <path d="M-10 -20 Q 30 -80 100 -110 Q 70 -60 40 -25 Q 15 -10 -10 -20 Z" fill="#451a03"/>
  </g>

  <!-- Small birds -->
  <g stroke="#451a03" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M120 130 q 8 -6 16 0 q 8 6 16 0"/>
    <path d="M170 100 q 7 -5 14 0 q 7 5 14 0"/>
    <path d="M660 140 q 9 -6 18 0 q 9 6 18 0"/>
  </g>
</svg>
