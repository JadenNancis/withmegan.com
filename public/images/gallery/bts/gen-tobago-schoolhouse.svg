<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Stylized Tobago schoolhouse at sunrise">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="60%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="800" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="620" cy="180" r="140" fill="url(#sun)"/>
  <circle cx="620" cy="180" r="65" fill="#fde68a"/>

  <!-- Distant sea + Tobago silhouette hills -->
  <path d="M0 460 Q 200 380 420 440 T 800 430 L 800 800 L 0 800 Z" fill="#0c4a6e" opacity="0.6"/>
  <path d="M0 500 Q 240 430 480 470 T 800 490 L 800 800 L 0 800 Z" fill="url(#land)"/>

  <!-- Schoolhouse -->
  <g transform="translate(300 440)">
    <!-- body -->
    <rect x="-80" y="0" width="200" height="140" rx="6" fill="#ffffff" stroke="#0c4a6e" stroke-width="3"/>
    <!-- Windows -->
    <rect x="-62" y="20" width="34" height="40" rx="3" fill="#06b6d4" stroke="#0c4a6e" stroke-width="2"/>
    <rect x="42" y="20" width="34" height="40" rx="3" fill="#06b6d4" stroke="#0c4a6e" stroke-width="2"/>
    <!-- Door -->
    <rect x="-10" y="80" width="34" height="60" rx="3" fill="#7c2d12"/>
    <!-- Roof -->
    <path d="M-110 0 L 20 -80 L 150 0 Z" fill="url(#roof)" stroke="#7c2d12" stroke-width="3"/>
    <!-- Chimney -->
    <rect x="90" y="-70" width="20" height="40" fill="#7c2d12"/>
    <!-- Flag on roof -->
    <line x1="20" y1="-80" x2="20" y2="-130" stroke="#0c4a6e" stroke-width="4"/>
    <polygon points="20,-130 60,-118 20,-106" fill="#dc2626"/>
    <!-- Steps -->
    <rect x="-20" y="140" width="56" height="10" rx="2" fill="#94a3b8"/>
    <rect x="-28" y="150" width="72" height="10" rx="2" fill="#64748b"/>
  </g>

  <!-- Palm trees -->
  <g transform="translate(100 560)">
    <!-- trunk -->
    <path d="M0 0 Q 8 -80 -6 -160" stroke="#5d4028" stroke-width="14" fill="none" stroke-linecap="round"/>
    <!-- fronds -->
    <g fill="#166534">
      <path d="M-6 -160 Q -60 -180 -95 -150 Q -50 -160 -6 -160"/>
      <path d="M-6 -160 Q -90 -200 -110 -180 Q -70 -165 -6 -160"/>
      <path d="M-6 -160 Q 50 -200 95 -180 Q 40 -160 -6 -160"/>
      <path d="M-6 -160 Q 80 -180 105 -150 Q 50 -155 -6 -160"/>
      <path d="M-6 -160 Q 10 -220 0 -240 Q -20 -210 -6 -160"/>
      <path d="M-6 -160 Q -50 -220 -70 -230 Q -30 -200 -6 -160"/>
    </g>
    <!-- Coconuts -->
    <circle cx="-14" cy="-150" r="7" fill="#3b2a1a"/>
    <circle cx="2" cy="-148" r="7" fill="#3b2a1a"/>
  </g>

  <g transform="translate(700 600)">
    <path d="M0 0 Q -6 -90 8 -180" stroke="#5d4028" stroke-width="16" fill="none" stroke-linecap="round"/>
    <g fill="#166534">
      <path d="M8 -180 Q 70 -200 110 -170 Q 60 -180 8 -180"/>
      <path d="M8 -180 Q 90 -220 110 -200 Q 70 -185 8 -180"/>
      <path d="M8 -180 Q -50 -220 -95 -200 Q -40 -180 8 -180"/>
      <path d="M8 -180 Q -80 -200 -105 -170 Q -50 -175 8 -180"/>
      <path d="M8 -180 Q -10 -240 0 -260 Q 20 -230 8 -180"/>
      <path d="M8 -180 Q 50 -240 70 -250 Q 30 -220 8 -180"/>
    </g>
  </g>

  <!-- Birds in sky -->
  <g stroke="#0c4a6e" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M180 200 q 12 -8 24 0 q 12 8 24 0"/>
    <path d="M420 240 q 10 -7 20 0 q 10 7 20 0"/>
    <path d="M680 320 q 9 -6 18 0 q 9 6 18 0"/>
  </g>

  <!-- Foreground grass -->
  <path d="M0 720 Q 200 700 400 720 T 800 720 L 800 800 L 0 800 Z" fill="#0f5132"/>
</svg>
